name: Verify Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify site is reachable
        run: |
          echo "Netlify auto-deploys from GitHub main branch."
          echo "Checking shivaaionline.in is reachable..."
          curl -s -o /dev/null -w "HTTP status: %{http_code}" https://shivaaionline.in || true
          echo ""
          echo "Deploy triggered. Netlify will build and publish automatically."
