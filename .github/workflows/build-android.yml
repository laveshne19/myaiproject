name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'sw.js'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" 2>&1 || \
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" 2>&1
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Configure bubblewrap
        run: |
          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "Bubblewrap config written:"
          cat $HOME/.bubblewrap/config.json

      - name: Decode or generate keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using provided keystore from secret"
            echo "$KEYSTORE_B64" | base64 --decode > android.keystore
          else
            echo "KEYSTORE_BASE64 not set — generating temporary keystore for this build"
            keytool -genkeypair \
              -alias my-key-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore android.keystore \
              -storepass fa6Lwd5ensEV \
              -keypass fa6Lwd5ensEV \
              -dname "CN=Shiv AI, OU=App, O=ShivaaionlineIn, L=India, ST=India, C=IN" \
              -noprompt
            echo "Temporary keystore created"
          fi
          keytool -list -v -keystore android.keystore -storepass fa6Lwd5ensEV 2>&1 | grep -E "Alias|SHA|Valid"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create twa-manifest.json
        run: |
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "in.shivaaionline.twa",
            "host": "shivaaionline.in",
            "name": "Shiv AI - Divine Wisdom",
            "launcherName": "Shiv AI",
            "display": "standalone",
            "themeColor": "#FF6B35",
            "themeColorDark": "#0A0A1A",
            "navigationColor": "#0A0A1A",
            "navigationColorDark": "#0A0A1A",
            "navigationDividerColor": "#0A0A1A",
            "navigationDividerColorDark": "#0A0A1A",
            "backgroundColor": "#0A0A1A",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://shivaaionline.in/icons/icon-512.png",
            "maskableIconUrl": "https://shivaaionline.in/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "my-key-alias"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://shivaaionline.in/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://shivaaionline.in/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [
              {
                "name": "built-in",
                "value": "2E:49:95:E3:CC:00:53:D0:4F:8F:30:38:EB:E0:D4:ED:EC:59:60:ED:0C:1B:3D:A9:42:2E:B4:B1:06:9F:7B:F2"
              }
            ],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "protocolHandlers": [],
            "fileHandlers": [],
            "launchHandlerClientMode": "",
            "displayOverride": [],
            "appVersion": "1.0.0"
          }
          EOF

      - name: Build TWA project
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --keystorePassword "fa6Lwd5ensEV" \
            --keyPassword "fa6Lwd5ensEV"

      - name: Find and list AAB files
        run: |
          find . -name "*.aab" 2>/dev/null | head -10
          find . -name "*.apk" 2>/dev/null | head -10

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiv-ai-android-aab
          path: |
            app-release-bundle.aab
            **/*.aab
            **/*.apk
          if-no-files-found: warn
          retention-days: 30
