name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'sw.js'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Inspect Android SDK structure
        run: |
          echo "=== ANDROID_HOME ==="
          echo "${ANDROID_HOME}"
          echo "=== SDK root contents ==="
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "Not found at /usr/local/lib/android/sdk"
          echo "=== build-tools ==="
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || echo "No build-tools dir"
          echo "=== platforms ==="
          ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null || echo "No platforms dir"
          echo "=== cmdline-tools ==="
          ls /usr/local/lib/android/sdk/cmdline-tools/ 2>/dev/null || echo "No cmdline-tools dir"
          echo "=== JAVA_HOME ==="
          echo "${JAVA_HOME}"
          java -version

      - name: Install Android build tools via sdkmanager
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses
          $SDKMANAGER "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          echo "=== After install: build-tools ==="
          ls $ANDROID_HOME/build-tools/
          echo "=== After install: platforms ==="
          ls $ANDROID_HOME/platforms/

      - name: Configure bubblewrap
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p $HOME/.bubblewrap
          echo "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$ANDROID_HOME\"}" > $HOME/.bubblewrap/config.json
          echo "=== bubblewrap config ==="
          cat $HOME/.bubblewrap/config.json

      - name: Decode or generate keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android.keystore
          else
            keytool -genkeypair -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore android.keystore -storepass fa6Lwd5ensEV -keypass fa6Lwd5ensEV \
              -dname "CN=Shiv AI, OU=App, O=ShivaaionlineIn, L=India, ST=India, C=IN" -noprompt
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create twa-manifest.json
        run: |
          cat > twa-manifest.json << 'TWAMAN'
          {
            "packageId": "in.shivaaionline.twa",
            "host": "shivaaionline.in",
            "name": "Shiv AI - Divine Wisdom",
            "launcherName": "Shiv AI",
            "display": "standalone",
            "themeColor": "#FF6B35",
            "themeColorDark": "#0A0A1A",
            "navigationColor": "#0A0A1A",
            "navigationColorDark": "#0A0A1A",
            "navigationDividerColor": "#0A0A1A",
            "navigationDividerColorDark": "#0A0A1A",
            "backgroundColor": "#0A0A1A",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://shivaaionline.in/icons/icon-512.png",
            "maskableIconUrl": "https://shivaaionline.in/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "my-key-alias"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://shivaaionline.in/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://shivaaionline.in/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [
              {
                "name": "built-in",
                "value": "2E:49:95:E3:CC:00:53:D0:4F:8F:30:38:EB:E0:D4:ED:EC:59:60:ED:0C:1B:3D:A9:42:2E:B4:B1:06:9F:7B:F2"
              }
            ],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "protocolHandlers": [],
            "fileHandlers": [],
            "launchHandlerClientMode": "",
            "displayOverride": [],
            "appVersion": "1.0.0"
          }
          TWAMAN
          echo "=== twa-manifest.json ==="
          cat twa-manifest.json

      - name: Build TWA project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --keystorePassword "fa6Lwd5ensEV" \
            --keyPassword "fa6Lwd5ensEV"

      - name: Find AAB file
        run: find . -name "*.aab" 2>/dev/null | head -5 || echo "No AAB found"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiv-ai-android-aab
          path: |
            app-release-bundle.aab
            **/*.aab
          if-no-files-found: warn
          retention-days: 30
