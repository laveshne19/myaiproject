name: Build Android App Bundle

# Produces the signed .aab for Google Play. The version code comes from the run
# number, so every build is uploadable without editing anything by hand.
#
# Required repository secrets:
#   KEYSTORE_BASE64    base64 of the release keystore  (base64 -w0 android.keystore)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_PASSWORD       key password (often the same)
#
# The SHA-256 fingerprint in .well-known/assetlinks.json must match the key Play
# actually signs with. With Play App Signing that is the *app signing key* shown
# under Play Console → Test and release → App integrity, not the upload key.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name shown on Play (e.g. 2.0.0)'
        required: true
        default: '2.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Fail early if signing secrets are missing
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KS" ]  || { echo "KEYSTORE_BASE64 secret is not set."; exit 1; }
          [ -n "$KSP" ] || { echo "KEYSTORE_PASSWORD secret is not set."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Write twa-manifest.json
        env:
          VERSION_NAME: ${{ github.event.inputs.versionName }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cat > twa-manifest.json <<EOF
          {
            "packageId": "in.shivaaionline.twa",
            "host": "shivaaionline.in",
            "name": "Shiv AI - Divine Wisdom, Mantras & Panchang",
            "launcherName": "Shiv AI",
            "display": "standalone",
            "themeColor": "#080813",
            "themeColorDark": "#080813",
            "navigationColor": "#080813",
            "navigationColorDark": "#080813",
            "navigationDividerColor": "#080813",
            "navigationDividerColorDark": "#080813",
            "backgroundColor": "#080813",
            "enableNotifications": false,
            "startUrl": "/?source=twa",
            "iconUrl": "https://shivaaionline.in/icons/icon-512.png",
            "maskableIconUrl": "https://shivaaionline.in/icons/maskable-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "my-key-alias" },
            "appVersionName": "${VERSION_NAME}",
            "appVersionCode": ${VERSION_CODE},
            "shortcuts": [
              { "name": "Chant",     "shortName": "Jaap",     "url": "/#/jaap",     "chosenIconUrl": "https://shivaaionline.in/icons/icon-192.png" },
              { "name": "Ask Shiva", "shortName": "Vaani",    "url": "/#/vaani",    "chosenIconUrl": "https://shivaaionline.in/icons/icon-192.png" },
              { "name": "Panchang",  "shortName": "Panchang", "url": "/#/panchang", "chosenIconUrl": "https://shivaaionline.in/icons/icon-192.png" }
            ],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://shivaaionline.in/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://shivaaionline.in/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "protocolHandlers": [],
            "fileHandlers": [],
            "launchHandlerClientMode": "",
            "displayOverride": [],
            "appVersion": "${VERSION_NAME}"
          }
          EOF
          cat twa-manifest.json

      - name: Confirm assetlinks is live and well formed
        run: |
          set -e
          curl -sf --max-time 25 https://shivaaionline.in/.well-known/assetlinks.json -o assetlinks.json
          cat assetlinks.json
          node -e "
            const a = require('./assetlinks.json');
            const e = a.find(x => x.target && x.target.package_name === 'in.shivaaionline.twa');
            if (!e) { console.error('assetlinks.json does not list in.shivaaionline.twa'); process.exit(1); }
            if (!(e.target.sha256_cert_fingerprints || []).length) { console.error('no fingerprint listed'); process.exit(1); }
            console.log('assetlinks OK —', e.target.sha256_cert_fingerprints.length, 'fingerprint(s)');
          "

      - name: Build the bundle
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keyPassword "${{ secrets.KEY_PASSWORD }}"

      - name: Locate artefacts
        id: find
        run: |
          find . -name '*.aab' -o -name '*.apk' | tee artefacts.txt
          test -s artefacts.txt || { echo "No .aab or .apk was produced."; exit 1; }

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: shiv-ai-${{ github.event.inputs.versionName }}-${{ github.run_number }}
          path: |
            app-release-bundle.aab
            app-release-signed.apk
            **/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Remove keystore from the runner
        if: always()
        run: rm -f android.keystore
