name: Build and Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Generate launcher icons
        run: |
          for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $DENSITY in
              mdpi)    SIZE=48  ;;
              hdpi)    SIZE=72  ;;
              xhdpi)   SIZE=96  ;;
              xxhdpi)  SIZE=144 ;;
              xxxhdpi) SIZE=192 ;;
            esac
            DIR="android/app/src/main/res/mipmap-$DENSITY"
            mkdir -p "$DIR"
            convert -size "${SIZE}x${SIZE}" xc:'#0A0A1A' \
              -fill '#FF6B35' -draw "circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),$((SIZE/5))" \
              "$DIR/ic_launcher.png"
            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
          done

      - name: Setup keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/android.keystore
          else
            keytool -genkeypair -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore android/android.keystore -storepass fa6Lwd5ensEV -keypass fa6Lwd5ensEV \
              -dname "CN=Shiv AI, OU=App, O=ShivaaionlineIn, L=India, ST=India, C=IN" -noprompt
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/android.keystore
          KEYSTORE_PASSWORD: fa6Lwd5ensEV
          KEY_PASSWORD: fa6Lwd5ensEV

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.0.0-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: "Shiv AI ${{ steps.version.outputs.name }}"
          body: |
            ## Shiv AI - Divine Wisdom

            Chat with Lord Shiva, seek divine guidance, share your problems and receive sacred wisdom.

            ### Install on Android
            1. Download `shiv-ai.apk` below
            2. On your Android phone, open the downloaded file
            3. If prompted, allow installation from unknown sources
            4. Install and open Shiv AI

            The app connects to shivaaionline.in for the full divine experience.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
