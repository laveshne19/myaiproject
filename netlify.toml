[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[build]
  functions = "netlify/functions"
  # Shiv AI (this repo's root index.html) needs no build step. The only thing
  # that needs building is the Aura voice-recorder site living in
  # voice-recorder-site/ — build it and drop its static export at /voice-recorder
  # so both apps can be served from the same Netlify site without touching
  # Shiv AI's files.
  command = "cd voice-recorder-site && npm install && npm run build && rm -rf ../voice-recorder && mv out ../voice-recorder"

[build.environment]
  # Next.js 16 (used by voice-recorder-site) requires Node >= 20.9; pin the
  # build image so it doesn't fall back to an older default runtime.
  NODE_VERSION = "22"

[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Serve the Aura voice-recorder static export as-is; must come before the
# Shiv AI catch-all below, which force-redirects everything else to /index.html.
[[redirects]]
  from = "/voice-recorder/*"
  to = "/voice-recorder/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
